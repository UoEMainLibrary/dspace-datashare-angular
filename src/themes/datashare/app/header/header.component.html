<header class="container-masthead">
    <div class="container">
        <div _ngcontent-dspace-angular-c183="" class="uoe-logo">
            <a _ngcontent-dspace-angular-c183="" title="Link to the Univeristy of Edinburgh's home page"
                alt="Image of the Univeristy of Edinburgh's logo" href="https://www.ed.ac.uk/">
                <img _ngcontent-dspace-angular-c183="" alt="University of Edinburgh Library Logo"
                    src="/assets/datashare/images/uoe-logo-long.png">
            </a>
            <a href="https://library.ed.ac.uk/research-support/research-data-service/contact"  title="contact Us" target="_blank" class="btn btn-primary contact-us-btn" type="button" >Contact Us</a>
        </div>
        
    </div>
</header>

<header>
    <div class="container">
        <div class="d-flex flex-row justify-content-between">
            <a class="navbar-brand my-2" routerLink="/home">
                <!-- <img src="/assets/datashare/images/datashare_edinburgh.png" [attr.alt]="'menu.header.image.logo' | translate"
                    class="datashare-logo" /> -->
                <img src="/assets/datashare/images/datashare-logo.svg" [attr.alt]="'menu.header.image.logo' | translate"
                    class="datashare-logo" />
            </a>
            <h1 class="navbar-header">Edinburgh Datashare</h1>
        


    <nav role="navigation" [attr.aria-label]="'nav.user.description' | translate" class="navbar navbar-light navbar-expand-md flex-shrink-0 px-0">
        <ds-search-navbar></ds-search-navbar>
        <!-- <ds-lang-switch></ds-lang-switch> -->
        <ds-context-help-toggle></ds-context-help-toggle>
        <ds-auth-nav-menu></ds-auth-nav-menu>
        <ds-impersonate-navbar></ds-impersonate-navbar>
        <div *ngIf="isMobile$ | async" class="pl-2">
          <button class="navbar-toggler px-0" type="button" (click)="toggleNavbar()"
                  aria-controls="collapsingNav"
                  aria-expanded="false" [attr.aria-label]="'nav.toggle' | translate">
            <span class="fas fa-bars fa-fw toggler-icon" aria-hidden="true"></span>
          </button>
        </div>
      </nav>
    </div>
</div>
</header>
